name: Paper-Forward-Forschung
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Nur prüfen, keine Ergebnisse schreiben oder pushen
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: paper-forward
  cancel-in-progress: false
jobs:
  forward:
    # Aktiviert durch den Repo-Besitzer am 13.11.2026 (Start 14.11.2026).
    # Stoppen: Repository-Variable FORWARD_ENABLED=false setzen.
    if: (github.event_name == 'workflow_dispatch' && inputs.dry_run) || vars.FORWARD_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LIVE_ENABLED: 'false'
      AI_ALLOW_REMOTE: 'false'
      FORWARD_ENABLED: ${{ vars.FORWARD_ENABLED != 'false' && 'true' || 'false' }}
      FORWARD_START: ${{ vars.FORWARD_START || '2026-11-14' }}
      FORWARD_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Ergebnisbranch laden
        if: env.FORWARD_DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORWARD_START"
          if git show-ref --verify --quiet refs/remotes/origin/paper-forward; then
            mkdir -p /tmp/forward-output
            git archive origin/paper-forward forward | tar -x -C /tmp/forward-output
          else
            mkdir -p /tmp/forward-output
          fi
      - name: Tageslauf nur mit Spielgeld
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORWARD_DRY_RUN" == 'true' ]]; then
            start="$(date -u +%F)"
            pnpm forward:run --dry-run --start "$start" --output /tmp/forward-output/forward
          else
            test "$FORWARD_ENABLED" = 'true'
            pnpm forward:run --start "$FORWARD_START" --output /tmp/forward-output/forward
          fi
      - name: Datenschutz prüfen und Ergebnisse speichern
        if: env.FORWARD_DRY_RUN != 'true' && vars.FORWARD_ENABLED != 'false'
        env:
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/paper-forward; then
            git checkout --detach origin/paper-forward
          fi
          mkdir -p forward
          cp -R /tmp/forward-output/forward/. ./forward/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- forward/
          if git diff --cached --quiet; then exit 0; fi
          node "$GITHUB_WORKSPACE/.github/privacy-guard/check.mjs"
          git commit -m 'docs: Tagesstand der Forward-Forschung'
          git push origin HEAD:refs/heads/paper-forward
