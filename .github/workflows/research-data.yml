name: Research-Daten und Schnelltest

# Manuell gestartet. Lädt nur öffentliche, kostenlose Binance-Public-Data-Kerzen
# (kein Account, kein API-Key) und führt den vorregistrierten Schnelltest #33 aus.
# Daten bleiben im Artefakt und werden nie ins Repository committet.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Kommagetrennte Paare; leer = alle archivierten USDT-Paare
        default: ''
      from:
        description: Startmonat (YYYY-MM)
        default: '2020-01'
      to:
        description: Endmonat (YYYY-MM), nie später als 2023-12 für Entwicklung
        default: '2023-12'
      intervals:
        description: Intervalle
        default: 1d,1h
      run_spike:
        description: Schnelltest #33 ausführen und Ergebnis ins Issue posten
        type: boolean
        default: true

      run_trend:
        description: H-025 Forschungslauf mit Annahmen (keine Pipeline-Freigabe)
        type: boolean
        default: false

      run_trend_v2:
        description: H-025 v2 mit aktuellen Mengenregeln als historischer Annahme
        type: boolean
        default: false

      run_profiles:
        description: H-025 v2 mit drei vorregistrierten Risikoprofilen (nur Entwicklung)
        type: boolean
        default: false

      run_v3:
        description: H-025 v3 – vier feste Drawdown-Reentry-Varianten (nur Entwicklung 2020–2023)
        type: boolean
        default: false

      run_v4:
        description: H-025 v4 – acht feste Ursachen-Diagnosen, KEIN Paper-Kandidat
        type: boolean
        default: false

      run_v5:
        description: H-025 v5 – vier feste BTC/ETH-Profile mit 2019-Indikator-Warm-up
        type: boolean
        default: false

      run_v51:
        description: H-025 v5.1 – vier BTC/ETH-Profile mit 30-Tage-Wiedereinstieg und v5-Vergleich
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: research-data
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LIVE_ENABLED: 'false'
      AI_ALLOW_REMOTE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Runner ist ab Werk >80 % belegt; die Archiv-Sicherung verlangt 20 % frei.
      - name: Vorinstallierte, ungenutzte Software entfernen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: pnpm 11.25.0 mit Corepack aktivieren
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Entwicklungsfenster vor jedem Download prüfen
        env:
          IMPORT_FROM: ${{ inputs.from }}
          IMPORT_TO: ${{ inputs.to }}
          IMPORT_INTERVALS: ${{ inputs.intervals }}
          RUN_TREND: ${{ inputs.run_trend }}
          RUN_TREND_V2: ${{ inputs.run_trend_v2 }}
          RUN_PROFILES: ${{ inputs.run_profiles }}
          RUN_V3: ${{ inputs.run_v3 }}
          RUN_V4: ${{ inputs.run_v4 }}
          RUN_V5: ${{ inputs.run_v5 }}
          RUN_V51: ${{ inputs.run_v51 }}
          IMPORT_SYMBOLS: ${{ inputs.symbols }}
        run: |
          pnpm --filter @paper/shared build
          if [[ "$RUN_TREND_V2" == 'true' || "$RUN_PROFILES" == 'true' || "$RUN_V3" == 'true' || "$RUN_V4" == 'true' ]]; then
            pnpm --filter @paper/server exec tsx -e "import {validateV2Inputs} from './src/backtest/trend-research-v2.ts'; validateV2Inputs(process.env.IMPORT_FROM!,process.env.IMPORT_TO!,process.env.IMPORT_INTERVALS!,process.env.IMPORT_SYMBOLS!);"
          fi
          if [[ "$RUN_V5" == 'true' || "$RUN_V51" == 'true' ]]; then
            if [[ "$RUN_V5" == 'true' && "$RUN_V51" == 'true' || "$RUN_TREND" == 'true' || "$RUN_TREND_V2" == 'true' || "$RUN_PROFILES" == 'true' || "$RUN_V3" == 'true' || "$RUN_V4" == 'true' ]]; then
              echo "H-025 v5/v5.1 must run independently of all other research modes"
              exit 1
            fi
            pnpm --filter @paper/server exec tsx -e "import {validateV5Inputs} from './src/backtest/trend-research-v2.ts'; validateV5Inputs(process.env.IMPORT_FROM!,process.env.IMPORT_TO!,process.env.IMPORT_INTERVALS!,process.env.IMPORT_SYMBOLS!);"
          else
            pnpm --filter @paper/server exec tsx -e "import {validateResearchMonths} from './src/backtest/trend-research.ts'; validateResearchMonths(process.env.IMPORT_FROM!,process.env.IMPORT_TO!); if(process.env.RUN_TREND==='true'&&(process.env.IMPORT_FROM!=='2020-01'||process.env.IMPORT_TO!=='2023-12'||process.env.IMPORT_INTERVALS!=='1d,1h'||process.env.IMPORT_SYMBOLS!=='')) throw Error('H-025 requires fixed 2020-01..2023-12 and 1d,1h with empty symbols');"
          fi
      - name: Öffentliche Binance-Kerzen importieren
        env:
          IMPORT_FROM: ${{ inputs.from }}
          IMPORT_TO: ${{ inputs.to }}
          IMPORT_SYMBOLS: ${{ inputs.symbols }}
          IMPORT_INTERVALS: ${{ inputs.intervals }}
        run: pnpm data:import --from "$IMPORT_FROM" --to "$IMPORT_TO" --symbols "$IMPORT_SYMBOLS" --intervals "$IMPORT_INTERVALS" --quote USDT
      - name: Trendfolge H-025 mit vorregistrierten Forschungsannahmen
        if: ${{ inputs.run_trend }}
        run: pnpm --filter @paper/server exec tsx src/backtest/trend-research-cli.ts | tee trend.txt
      - name: Trendfolge H-025 v2 mit Mengenregel-Annahme
        if: ${{ inputs.run_trend_v2 }}
        run: pnpm --filter @paper/server exec tsx src/backtest/trend-research-v2-cli.ts | tee trend-v2.txt
      - name: H-025 v2 – drei Risikoprofile nacheinander
        if: ${{ inputs.run_profiles }}
        run: pnpm --filter @paper/server exec tsx src/backtest/trend-research-v2-cli.ts --profiles | tee trend-profiles.txt
      - name: H-025 v3 – Basis und drei Risikoprofile, ein Datenimport
        if: ${{ inputs.run_v3 }}
        run: pnpm --filter @paper/server exec tsx src/backtest/trend-research-v2-cli.ts --v3 | tee trend-v3.txt
      - name: Datenbericht
        run: pnpm data:report | tee data-report.txt
      - name: Schnelltest #33 (SMA200-Vergleich fuer v4/v5 verpflichtend)
        if: ${{ inputs.run_v51 || inputs.run_v5 || inputs.run_v4 || (inputs.run_spike && !inputs.run_v3) }}
        run: pnpm trend:spike | tee spike.txt
      - name: H-025 v4 – acht Diagnosen ohne Drawdown-Bremse
        if: ${{ inputs.run_v4 }}
        run: pnpm --filter @paper/server exec tsx src/backtest/trend-research-v2-cli.ts --v4 | tee trend-v4.txt
      - name: H-025 v5 – vier BTC/ETH-Trendfolge-Risikoprofile
        if: ${{ inputs.run_v5 }}
        run: pnpm --filter @paper/server exec tsx src/backtest/trend-research-v5-cli.ts | tee trend-v5.txt
      - name: H-025 v5.1 – vier Wiedereinstiegsprofile und unveränderte v5-Referenzen
        if: ${{ inputs.run_v51 }}
        run: pnpm --filter @paper/server exec tsx src/backtest/trend-research-v51-cli.ts | tee trend-v51.txt
      - name: Ergebnisse als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: |
            data-report.txt
            spike.txt
            trend.txt
            trend-v2.txt
            trend-profiles.txt
            trend-v3.txt
            trend-v4.txt
            trend-v5.txt
            trend-v51.txt
            data/trend-research-v51/
            data/trend-research-v5/
            data/trend-research-v4/
            data/trend-research-v3/
            data/trend-research-v2/
            data/trend-research/
            data/archive/report.json
            docs/spikes/
            docs/DATA-ARCHIVE.md
          if-no-files-found: ignore
      - name: Ergebnis in Issue #18 kommentieren (alt #33)
        if: ${{ inputs.run_spike && !inputs.run_v3 && !inputs.run_v4 && !inputs.run_v5 && !inputs.run_v51 && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Automatischer Lauf** (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            cat docs/spikes/TREND-1D-SPIKE.md
          } > comment.md
          gh issue comment 18 --repo "${{ github.repository }}" --body-file comment.md
      - name: Forschungsergebnis in Issue #3 kommentieren (alt #4)
        if: ${{ inputs.run_trend && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Automatischer Forschungslauf** (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            cat data/trend-research/summary.md
          } > trend-comment.md
          gh issue comment 3 --repo "${{ github.repository }}" --body-file trend-comment.md
      - name: Forschungsergebnis aller Profile in Issue #7 kommentieren
        if: ${{ inputs.run_profiles && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: |
          cp data/trend-research-v2/profiles-summary.md profile-comment.md
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; writeFileSync("profile-comment-event.json",JSON.stringify({comment:{body:readFileSync("profile-comment.md","utf8")}}));'
          PG_MODE=text GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$PWD/profile-comment-event.json" node .github/privacy-guard/check.mjs
          gh issue comment 7 --repo "${{ github.repository }}" --body-file profile-comment.md
      - name: H-025 v3 – vor Kommentar Datenschutz-Wächter und Ergebnis in Issue #7
        if: ${{ inputs.run_v3 && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: |
          cp data/trend-research-v3/summary.md v3-comment.md
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; writeFileSync("v3-comment-event.json",JSON.stringify({comment:{body:readFileSync("v3-comment.md","utf8")}}));'
          PG_MODE=text GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$PWD/v3-comment-event.json" node .github/privacy-guard/check.mjs
          gh issue comment 7 --repo "${{ github.repository }}" --body-file v3-comment.md
      - name: Forschungsergebnis v2 in Issue #3 kommentieren
        if: ${{ inputs.run_trend_v2 && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: |
          {
            echo "**H-025 v2: automatischer Forschungslauf mit Annahmen** (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            cat data/trend-research-v2/summary.md
          } > trend-v2-comment.md
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; writeFileSync("trend-v2-comment-event.json",JSON.stringify({comment:{body:readFileSync("trend-v2-comment.md","utf8")}}));'
          PG_MODE=text GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$PWD/trend-v2-comment-event.json" node .github/privacy-guard/check.mjs
          gh issue comment 3 --repo "${{ github.repository }}" --body-file trend-v2-comment.md
      - name: H-025 v4 – Datenschutzprüfung und Kommentar in Issue #3
        if: ${{ inputs.run_v4 && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: |
          cp data/trend-research-v4/summary.md v4-comment.md
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; writeFileSync("v4-comment-event.json",JSON.stringify({comment:{body:readFileSync("v4-comment.md","utf8")}}));'
          PG_MODE=text GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$PWD/v4-comment-event.json" node .github/privacy-guard/check.mjs
          gh issue comment 3 --repo "${{ github.repository }}" --body-file v4-comment.md
      - name: H-025 v5 – Datenschutzprüfung und Kommentar in Issue #3
        if: ${{ inputs.run_v5 && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: |
          cp data/trend-research-v5/summary.md v5-comment.md
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; writeFileSync("v5-comment-event.json",JSON.stringify({comment:{body:readFileSync("v5-comment.md","utf8")}}));'
          PG_MODE=text GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$PWD/v5-comment-event.json" node .github/privacy-guard/check.mjs
          gh issue comment 3 --repo "${{ github.repository }}" --body-file v5-comment.md

      - name: H-025 v5.1 – Datenschutzprüfung und Kommentar in Issue #3
        if: ${{ inputs.run_v51 && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: |
          cp data/trend-research-v51/summary.md v51-comment.md
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; writeFileSync("v51-comment-event.json",JSON.stringify({comment:{body:readFileSync("v51-comment.md","utf8")}}));'
          PG_MODE=text GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$PWD/v51-comment-event.json" node .github/privacy-guard/check.mjs
          gh issue comment 3 --repo "${{ github.repository }}" --body-file v51-comment.md
